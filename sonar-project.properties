sonar.organization=jochentcc
sonar.projectKey=JochenTCC_Edibert
sonar.projectName=Edibert
sonar.python.version=3.11
sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/tests/**,**/docs/**,**/examples/**,**/.cursor/**
sonar.coverage.exclusions=**/tests/**
sonar.python.coverage.reportPaths=coverage.xml

# Ignore intentional / non-agentic findings (also mirror under Project Administration ->
# Analysis Scope -> "Ignore Issues on Multiple Criteria" when possible).
# llm1: agentic-LLM CLI taint, path traversal (local operator CLI `python -m edibert price --tariff PATH`;
#       a person runs it, there is no LLM agent runtime). Same decision as in the Earnie repo.
# llm2: the same taint for command arguments: `python -m edibert ui --port/--data-dir/--catalog` starts
#       Streamlit with an argument list (no shell) from values the person typed.
sonar.issue.ignore.multicriteria=llm1,llm2
sonar.issue.ignore.multicriteria.llm1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.llm1.resourceKey=**/*
sonar.issue.ignore.multicriteria.llm2.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.llm2.resourceKey=**/*
